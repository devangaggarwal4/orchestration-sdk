[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outlook-agent"
version = "0.1.0"
description = "Local agentic assistant for Outlook, powered by Ollama (qwen3:8b)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "msal>=1.28",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
outlook-agent = "outlook_agent.cli:main"

[tool.setuptools]
packages = ["outlook_agent"]
