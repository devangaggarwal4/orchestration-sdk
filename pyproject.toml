[project]
name = "hybrid-router"
version = "0.1.0"
description = "Route LLM calls between local models (Ollama) and Claude via OpenRouter, with telemetry and cost tracking."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "httpx2>=2.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
hybrid-router = "hybrid_router.cli:app"

[project.entry-points."hybrid_router.backends"]
ollama = "hybrid_router.backends.ollama:OllamaBackend"
openai_compat = "hybrid_router.backends.openai_compat:OpenAICompatBackend"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_router"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs a running Ollama and OPENROUTER_API_KEY"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
