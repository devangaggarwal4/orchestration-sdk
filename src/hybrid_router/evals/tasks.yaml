- id: code-lru-cache
  difficulty: hard
  task_type: code
  min_tier: sonnet
  prompt: |
    Implement a Python class LRUCache(capacity: int) with get(key) -> value or -1 and
    put(key, value), both O(1). put on an existing key updates it and marks it most recently
    used; get marks a key most recently used; inserting beyond capacity evicts the least
    recently used key. Reply with the code in a ```python block.
  checks:
    - type: python_tests
      tests: |
        c = LRUCache(2)
        c.put(1, 1); c.put(2, 2)
        assert c.get(1) == 1
        c.put(3, 3)            # evicts 2
        assert c.get(2) == -1
        c.put(1, 10)           # update, 1 is most recent
        c.put(4, 4)            # evicts 3
        assert c.get(3) == -1 and c.get(1) == 10 and c.get(4) == 4
        z = LRUCache(1); z.put("a", 1); z.put("b", 2)
        assert z.get("a") == -1 and z.get("b") == 2
  reference: |
    ```python
    from collections import OrderedDict

    class LRUCache:
        def __init__(self, capacity: int):
            self.capacity = capacity
            self.data = OrderedDict()

        def get(self, key):
            if key not in self.data:
                return -1
            self.data.move_to_end(key)
            return self.data[key]

        def put(self, key, value):
            self.data[key] = value
            self.data.move_to_end(key)
            if len(self.data) > self.capacity:
                self.data.popitem(last=False)
    ```

- id: code-merge-intervals
  difficulty: hard
  task_type: code
  min_tier: sonnet
  prompt: |
    Write merge_intervals(intervals: list[tuple[int, int]]) -> list[tuple[int, int]] in Python.
    Input may be unsorted; intervals that overlap or touch (end == next start) merge; return
    sorted tuples; an empty list returns []. Reply with the code in a ```python block.
  checks:
    - type: python_tests
      tests: |
        assert merge_intervals([]) == []
        assert merge_intervals([(5, 6), (1, 3), (2, 4)]) == [(1, 4), (5, 6)]
        assert merge_intervals([(1, 2), (2, 3)]) == [(1, 3)]
        assert merge_intervals([(1, 10), (2, 3), (4, 5)]) == [(1, 10)]
        assert merge_intervals([(3, 3)]) == [(3, 3)]
  reference: |
    ```python
    def merge_intervals(intervals):
        out = []
        for start, end in sorted(intervals):
            if out and start <= out[-1][1]:
                out[-1] = (out[-1][0], max(out[-1][1], end))
            else:
                out.append((start, end))
        return out
    ```

