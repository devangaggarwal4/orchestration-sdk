- id: fix-moving-average
  difficulty: hard
  task_type: code_review
  min_tier: sonnet
  prompt: |
    This function should return the list of averages of every window of k consecutive
    items, but it's wrong. Return a corrected version in a ```python block.

    ```python
    def moving_average(xs, k):
        out, s = [], 0
        for i, x in enumerate(xs):
            s += x
            if i >= k:
                s -= xs[i - k]
                out.append(s / k)
        return out
    ```
  checks:
    - type: python_tests
      tests: |
        assert moving_average([1, 2, 3, 4], 2) == [1.5, 2.5, 3.5]
        assert moving_average([5], 1) == [5.0]
        assert moving_average([1, 2], 3) == []
        assert moving_average([2, 4, 6], 3) == [4.0]
  reference: |
    ```python
    def moving_average(xs, k):
        out, s = [], 0
        for i, x in enumerate(xs):
            s += x
            if i >= k:
                s -= xs[i - k]
            if i >= k - 1:
                out.append(s / k)
        return out
    ```

