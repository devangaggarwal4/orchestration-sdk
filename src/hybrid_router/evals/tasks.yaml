- id: code-fizz-seven
  difficulty: medium
  task_type: code
  min_tier: local
  prompt: |
    Write a Python function classify(n: int) -> str that returns "Fizz" if n is divisible by 3,
    "Buzz" if divisible by 7, "FizzBuzz" if divisible by both, else str(n).
    Reply with the code in a ```python block.
  checks:
    - type: python_tests
      tests: |
        assert classify(3) == "Fizz"
        assert classify(14) == "Buzz"
        assert classify(21) == "FizzBuzz"
        assert classify(10) == "10"
        assert classify(0) == "FizzBuzz"
  reference: |
    ```python
    def classify(n: int) -> str:
        if n % 21 == 0:
            return "FizzBuzz"
        if n % 3 == 0:
            return "Fizz"
        if n % 7 == 0:
            return "Buzz"
        return str(n)
    ```

- id: code-parse-duration
  difficulty: medium
  task_type: code
  min_tier: local
  prompt: |
    Write a Python function parse_duration(s: str) -> int that converts strings like "1h30m",
    "45s", "2h", "1h2m3s" into total seconds. Raise ValueError for empty or malformed input.
    Reply with the code in a ```python block.
  checks:
    - type: python_tests
      tests: |
        assert parse_duration("1h30m") == 5400
        assert parse_duration("45s") == 45
        assert parse_duration("2h") == 7200
        assert parse_duration("1h2m3s") == 3723
        for bad in ["", "abc", "10x", "h"]:
            try:
                parse_duration(bad)
            except ValueError:
                pass
            else:
                raise AssertionError(bad)
  reference: |
    ```python
    import re

    def parse_duration(s: str) -> int:
        m = re.fullmatch(r"(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?", s or "")
        if not s or m is None or not any(m.groups()):
            raise ValueError(f"bad duration: {s!r}")
        h, mi, sec = (int(g) if g else 0 for g in m.groups())
        return h * 3600 + mi * 60 + sec
    ```

