- id: code-expression-parser
  difficulty: hard
  task_type: code
  min_tier: opus
  prompt: |
    Write evaluate(expr: str) -> float in Python that evaluates arithmetic with + - * /,
    parentheses, unary minus and decimals, respecting precedence and left associativity,
    WITHOUT using eval/exec/ast. Raise ValueError on malformed input.
    Reply with the code in a ```python block.
  checks:
    - type: python_tests
      tests: |
        assert evaluate("1 + 2 * 3") == 7
        assert evaluate("(1 + 2) * 3") == 9
        assert evaluate("10 - 4 - 3") == 3
        assert evaluate("8 / 4 / 2") == 1
        assert evaluate("-(2 + 3) * -2") == 10
        assert abs(evaluate("1.5 * 2") - 3.0) < 1e-9
        for bad in ["1 +", "(1", "2 * * 3", ""]:
            try:
                evaluate(bad)
            except ValueError:
                pass
            else:
                raise AssertionError(bad)
  reference: |
    ```python
    import re

    def evaluate(expr: str) -> float:
        tokens = re.findall(r"\d+\.?\d*|\.\d+|[()+\-*/]|\S", expr)
        pos = 0

        def peek():
            return tokens[pos] if pos < len(tokens) else None

        def take():
            nonlocal pos
            if pos >= len(tokens):
                raise ValueError("unexpected end")
            pos += 1
            return tokens[pos - 1]

        def expr_():
            v = term()
            while peek() in ("+", "-"):
                v = v + term() if take() == "+" else v - term()
            return v

        def term():
            v = factor()
            while peek() in ("*", "/"):
                v = v * factor() if take() == "*" else v / factor()
            return v

        def factor():
            t = take()
            if t == "-":
                return -factor()
            if t == "(":
                v = expr_()
                if take() != ")":
                    raise ValueError("expected )")
                return v
            try:
                return float(t)
            except ValueError:
                raise ValueError(f"bad token {t!r}") from None

        if not tokens:
            raise ValueError("empty")
        value = expr_()
        if pos != len(tokens):
            raise ValueError("trailing input")
        return value
    ```
