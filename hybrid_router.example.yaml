# hybrid-router configuration. Copy to hybrid_router.yaml and edit.
# Every value here is optional; omitted values use the built-in defaults.
# Override any value from the environment, e.g.:
#   HYBRID_ROUTER__TIERS__LOCAL__MODEL=llama3.1:8b
# Show the resolved config with:  hybrid-router config

tiers:
  # Cheapest tier. Any backend kind works here.
  local:
    kind: ollama
    model: qwen3:8b               # fits a 16 GB Mac at Q4; `ollama pull qwen3:8b`
    base_url: http://localhost:11434
    timeout_s: 60                 # a local call slower than this counts as failed
    num_ctx: 16384                # context window to request from Ollama
    think: false                  # qwen3 reasoning off for speed; true / "low" / "high" to enable
    keep_alive: 10m               # keep the model loaded between calls
    logprobs: true                # needed for the confidence validator (recent Ollama)
    default_max_tokens: 4096

  # Alternative local runtime: any OpenAI-compatible server (llama.cpp
  # `llama-server`, LM Studio, vLLM, mlx_lm.server). Replaces the block above.
  # local:
  #   kind: openai_compat
  #   model: qwen3-8b
  #   base_url: http://localhost:8080/v1
  #   api_key_env: ""             # local servers need no key
  #   logprobs: true
  #   prompt_caching: false

  # Default escalation target: Claude via OpenRouter. Needs OPENROUTER_API_KEY.
  sonnet:
    kind: openai_compat
    model: anthropic/claude-sonnet-5.5     # check ids at https://openrouter.ai/models
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    sampling_params: false        # Claude 5.5 rejects temperature
    forced_tool_choice: false     # ...and tool_choice any/tool
    prompt_caching: true          # cache_control breakpoints on system + latest message
    default_max_tokens: 16000
    # reasoning: {effort: medium} # OpenRouter reasoning settings
    # provider: {order: [anthropic], allow_fallbacks: true}   # OpenRouter provider routing
    # extra_headers: {X-Title: hybrid-router}                 # OpenRouter app attribution

  # Hardest tasks.
  opus:
    kind: openai_compat
    model: anthropic/claude-opus-5.5       # verify this id; `hybrid-router smoke` checks it
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    sampling_params: false
    forced_tool_choice: false
    prompt_caching: true
    default_max_tokens: 16000

routing:
  strategy: hybrid                # hybrid | pre_route | cascade
  easy_threshold: 0.25            # below: local, streamed, structural checks only
  hard_threshold: 0.65            # above: skip local
  opus_threshold: 0.85            # above: Opus instead of Sonnet
  escalate_hard_to_opus: true     # a hard validator failure on local goes straight to Opus
  escalation_mode: original       # original | revise (show the cloud model the failed draft)
  max_attempts: 3
  pre_route_fallback_on_error: true
  cloud_retries: 1
  local_concurrency: 1            # local generations at once

scorer:
  # score = 1 - prod(1 - weight * feature); each weight in [0, 1]
  weights: {tokens: 0.6, tools: 0.4, task_type: 0.8, keywords: 0.6, schema: 0.4}
  tokens_low: 2000                # context size feature ramps from 0 here...
  tokens_high: 24000              # ...to 1 here
  tools_saturation: 8
  task_type_default: 0.4          # unknown/missing task_type
  # task_types: {classify: 0.05, extract: 0.1, ..., multi_step_reasoning: 0.9}
  # keywords: [{pattern: '\bprove\b', weight: 1.0}, ...]
  sticky_steps: 3                 # after an escalation, boost the next N steps...
  sticky_boost: 0.25              # ...by this much (decaying)
  tool_error_boost: 0.2           # previous local step's tool call errored

validators:
  structural: {enabled: true}
  heuristic: {enabled: true, repetition_threshold: 0.5}
  confidence: {enabled: true, min_mean_logprob: -1.0, two_sample: false}
  execution: {enabled: true, python_compile: true}
  judge: {enabled: false, tier: local}

telemetry:
  enabled: true
  db_path: hybrid_router.sqlite
  # pricing_path: pricing.yaml    # default: ./pricing.yaml, else the packaged copy
  counterfactual_baseline: sonnet # "what if everything went to this tier"
  cache_assumption: observed      # observed | none (cache-hit ratio assumed for local routes)
  token_ratio_default: 1.15       # local->Claude tokens until escalations calibrate it
  token_ratio_min_samples: 20
